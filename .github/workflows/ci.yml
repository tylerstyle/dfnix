name: "dfnix CI"

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nix-flake-check:
    name: "Nix Flake Check & Evaluation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Free Disk Space
        run: |
          echo "Reclaiming runner disk space before Nix build..."
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check Flake Schema & System Assertions
        run: nix flake check --show-trace

      - name: Validate System Image Derivations
        run: |
          for img in iso iso-nvidia vm vmware virtualbox; do
            echo "Evaluating derivation for $img..."
            nix eval ".#packages.x86_64-linux.${img}.drvPath"
          done

      - name: Validate Custom Forensic Packages
        run: |
          for pkg in \
            dfcore dfdisk dfmount dfnet dfcollect dfkit \
            dfinfo dfnix-guide dfnix-session-chooser \
            dwarf2json regripper libvshadow libfsapfs libfvde \
            uac uac-kit velociraptor winpmem fuji fieldkit; do
            echo "Evaluating derivation for $pkg..."
            nix eval ".#packages.x86_64-linux.${pkg}.drvPath"
          done

  lint:
    name: "ShellCheck & Linting"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Run Make Check (Flake Eval, ShellCheck & Flakeless Entrypoint)
        run: make check LOCAL_TOOLS=0
