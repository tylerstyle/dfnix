# ==============================================================================
# Kitty Terminal Configuration for dfnix Forensic Live Environment
# Clean dark cyber aesthetic matching DF forensic branding
# ==============================================================================

# Font configuration
font_family      FiraCode Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window geometry & padding
window_padding_width 6
hide_window_decorations no
confirm_os_window_close 0
remember_window_size no
initial_window_width 100c
initial_window_height 32c

# Bell
enable_audio_bell no
visual_bell_duration 0.0

# Scrollback
scrollback_lines 10000

# Color Scheme: DF Forensic Dark (#121414)
foreground            #e0e0e0
background            #121414
background_opacity    0.95
selection_foreground  #121414
selection_background  #00d084

# Cursor
cursor                #00d084
cursor_text_color     #121414
cursor_shape          block
cursor_blink_interval 0

# URL styling
url_color             #00d084
url_style             curly

# Normal colors
color0 #121414
color1 #e06c75
color2 #00d084
color3 #e5c07b
color4 #61afef
color5 #c678dd
color6 #56b6c2
color7 #abb2bf

# Bright colors
color8  #5c6370
color9  #e06c75
color10 #00e699
color11 #e5c07b
color12 #61afef
color13 #c678dd
color14 #56b6c2
color15 #ffffff
