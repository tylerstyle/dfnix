# ==============================================================================
# Noctalia Initial State Override (v5.1.0+)
# Ensures no first-run wizard and pre-seeds the forensic wallpaper
# ==============================================================================

[shell]
setup_wizard_enabled = false

[storage]
key_source = "file"
key_file = "/home/nixos/.config/noctalia/storage.key"

[theme]
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kitty", "niri", "starship" ]

[wallpaper]
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval = 300
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "/home/nixos/Pictures/Wallpapers/digitale-forensik.jpg"

    [wallpaper.last]
    path = "/home/nixos/Pictures/Wallpapers/digitale-forensik.jpg"
