# ==============================================================================
# Noctalia Desktop Shell Configuration (v5.1.0+) for dfnix
# Tailored for forensic field workflow, dark cyber aesthetic, and zero popups
# ==============================================================================

[shell]
setup_wizard_enabled = false
telemetry_enabled = false
shared_gl_context = true
font_family = "Noto Sans"
corner_radius_scale = 1.0

    [shell.launcher]
    categories = true
    compact = false
    show_icons = true
    sort_by_usage = true
    pinned = [ "dfnix-guide.desktop", "dfdisk.desktop", "dfmount.desktop", "dfnet.desktop", "dfinfo.desktop", "kitty.desktop", "dolphin.desktop" ]

    [shell.panel]
    transparency_mode = "soft"

[storage]
key_source = "file"
key_file = "/home/nixos/.config/noctalia/storage.key"

[bar]
order = [ "default" ]

    [bar.default]
    enabled = true
    thickness = 34
    background_opacity = 0.65
    contact_shadow = true
    start = [ "launcher", "workspaces" ]
    center = [ "dfdisk_btn", "dfmount_btn", "dfnet_btn", "dfinfo_btn", "guide_btn" ]
    end = [ "clock", "tray", "volume", "brightness", "battery", "control-center" ]

[widget.dfdisk_btn]
type = "custom_button"
glyph = "disc"
label = "dfdisk"
tooltip = "Launch dfdisk Forensic Imager (Mod+D)"

    [widget.dfdisk_btn.actions]
    left = "exec kitty --title 'dfdisk - Forensic Imager' sudo dfdisk"

[widget.dfmount_btn]
type = "custom_button"
glyph = "device-floppy"
label = "dfmount"
tooltip = "Launch dfmount Forensic Storage Manager (Mod+M)"

    [widget.dfmount_btn.actions]
    left = "exec kitty --title 'dfmount - Forensic Storage Manager' sudo dfmount"

[widget.dfnet_btn]
type = "custom_button"
glyph = "network"
label = "dfnet"
tooltip = "Launch dfnet Forensic Network Operations (Mod+N)"

    [widget.dfnet_btn.actions]
    left = "exec kitty --title 'dfnet - Forensic Network Operations' sudo dfnet"

[widget.dfinfo_btn]
type = "custom_button"
glyph = "device-analytics"
label = "dfinfo"
tooltip = "Launch dfinfo Forensic System Triage & Fastfetch (Mod+I)"

    [widget.dfinfo_btn.actions]
    left = "exec kitty --title 'dfinfo - Forensic System Triage' sudo dfinfo"

[widget.guide_btn]
type = "custom_button"
glyph = "help-circle"
label = "Info"
tooltip = "Quick Start Guide & Niri Keybindings (F1)"

    [widget.guide_btn.actions]
    left = "exec dfnix-guide"

[wallpaper]
directory = "/home/nixos/Pictures/Wallpapers"
enabled = true
fill_color = "#121414"
fill_mode = "crop"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval = 300
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "/home/nixos/Pictures/Wallpapers/digitale-forensik.jpg"

    [wallpaper.last]
    path = "/home/nixos/Pictures/Wallpapers/digitale-forensik.jpg"

[theme]
builtin = "Noctalia"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kitty", "niri", "starship" ]
